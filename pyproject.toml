[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "branchgravity"
dynamic = ["version"]
description = "BranchGravitySolver: Strang-Fourier propagation of branch-resolved quantum states in superposed uniform gravitational fields"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Vasileios I. Kiosses"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/kiossesv/quantum-gravity-superposition-dynamics"

[tool.setuptools.dynamic]
version = {attr = "branchgravity.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
